name: format
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git checkout "${{ github.head_ref }}" && pip install ruff && ruff format .
